<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskChain — Autonomous Repository Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <p class="eyebrow">Autonomous Repository Agent</p>
        <h1>TaskChain</h1>
        <p class="hero-copy">
          Paste a public GitHub repository, ask questions about it, and turn issues
          into proposed fixes — all from one simple dashboard.
        </p>
      </header>

      <main class="workspace">
        <section class="panel" id="ingestPanel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">Step 1</p>
              <h2>Connect a Repository</h2>
            </div>
            <span id="repoStatusBadge" class="status-badge hidden">Checking status...</span>
          </div>
          <form id="ingestForm" class="query-form">
            <input
              id="repoUrlInput"
              type="url"
              placeholder="https://github.com/owner/repo"
              required
            />
            <button id="ingestButton" class="submit-button" type="submit">
              Ingest Repository
            </button>
          </form>
          <div id="ingestProgress" class="progress hidden">
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressLabel" class="progress-label">0%</span>
          </div>
          <p id="ingestMessage" class="status-message"></p>
        </section>

        <section class="panel" id="askPanel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">Repo-Aware Q&A</p>
              <h2>Ask About the Repo</h2>
            </div>
          </div>
          <form id="askForm" class="query-form">
            <input
              id="askInput"
              type="text"
              placeholder="e.g. What does this repo do? Where is authentication handled?"
              required
            />
            <button id="askButton" class="submit-button" type="submit">Ask</button>
          </form>
          <div id="askPipeline" class="pipeline hidden">
            <div id="askPipelineStages" class="pipeline-stages"></div>
            <span id="askTimer" class="pipeline-timer"></span>
          </div>
          <div id="answerBox" class="answer-box hidden"></div>
        </section>

        <section class="panel" id="fixPanel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">Issue → Pull Request</p>
              <h2>Generate a Fix</h2>
            </div>
          </div>
          <form id="fixForm" class="query-form stacked">
            <textarea
              id="fixInput"
              rows="4"
              placeholder="Describe the bug or feature request in plain English, or paste a GitHub issue URL."
              required
            ></textarea>
            <button id="fixButton" class="submit-button" type="submit">
              Plan & Verify Fix
            </button>
          </form>
          <div id="fixResult" class="result-box hidden"></div>
        </section>
      </main>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
