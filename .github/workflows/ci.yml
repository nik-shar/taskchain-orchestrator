name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Docker-marked tests need a daemon and are deselected here; run them locally
      # with `pytest -m docker`.
      - name: Test
        run: PYTHONPATH=. pytest -q -m "not docker"
